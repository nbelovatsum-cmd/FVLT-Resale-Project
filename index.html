<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FVLT Project</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#ffffff; --ink:#0a0a0a; --ink2:#333333; --muted:#767676; --line:#e8e8e8; --line2:#cfcfcf;
  --soft:#f7f7f7; --soft2:#f2f0ed; --pos:#1f6f43; --neg:#a3261f; --warn:#b26a00;
  --font:'Jost','Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1480px;margin:0 auto;padding:0 32px}
.muted{color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:20px 0 8px}
.logo{font-weight:600;font-size:30px;letter-spacing:.16em;text-transform:uppercase;text-align:center;line-height:1;white-space:nowrap}
.logo small{display:block;font-size:10px;letter-spacing:.46em;font-weight:400;margin-top:7px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dot.ok{background:#2e9d5b}.dot.warn{background:#e0a100}.dot.err{background:#c8372d}
.dot.busy{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{height:36px;padding:0 18px;border:1px solid var(--ink);background:var(--bg);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--soft)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#2a2a2a}
.btn.sm{height:30px;padding:0 14px}
.btn svg{width:14px;height:14px}
.tabs{display:flex;justify-content:center;gap:40px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 0 13px;text-transform:uppercase;letter-spacing:.18em;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.banner{background:var(--soft2);font-size:13px;line-height:1.5}
.banner .wrap{padding-top:10px;padding-bottom:10px;text-align:center}
.banner.err{background:#fbeceb}

/* ---------- blocks ---------- */
main{padding-bottom:80px}
.block{margin:36px 0 0}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.block-title{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;min-width:0}
.block-sub{margin-left:12px;color:var(--muted);letter-spacing:.04em;font-weight:400;text-transform:none;font-size:12px}
.block-tools{display:flex;gap:14px;align-items:center;flex:none}
.eye{background:none;border:0;padding:0;cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.eye:hover{color:var(--ink)}
.eye svg{width:15px;height:15px}
.block.is-hidden .block-body{display:none}
.block.is-hidden .block-head{border-bottom:1px dashed var(--line2)}
.block.is-hidden .block-title{color:#b3b3b3}
.block.is-hidden .block-title::after{content:'скрыто · не попадёт в выгрузку';margin-left:12px;font-size:11px;letter-spacing:.06em;text-transform:none;font-weight:400}
.note{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.55}
.note b{color:var(--ink2);font-weight:500}
.warnline{color:var(--warn)}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-size:13px}

/* ---------- KPI ---------- */
#kpiHost .block{margin-top:0}
#kpiHost .block-head{border-bottom:0;padding:14px 0 0;justify-content:flex-end}
#kpiHost .block-title{display:none}
#kpiHost .block.is-hidden .block-title{display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:1px solid var(--line)}
.kpi{padding:6px 16px 30px;text-align:center}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi-label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.kpi-val{font-size:44px;font-weight:300;letter-spacing:.01em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px}

/* ---------- data table ---------- */
.dt-tools{display:flex;gap:18px;align-items:center;padding:16px 0 12px;flex-wrap:wrap}
.search{height:34px;border:0;border-bottom:1px solid var(--line2);min-width:260px;outline:none;padding:0 2px;background:transparent}
.search:focus{border-bottom-color:var(--ink)}
.count{font-size:12px;color:var(--muted);letter-spacing:.04em}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.dt-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
.dt-wrap.tall{max-height:72vh}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.dt th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 12px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
.dt th.num{text-align:right}
.th{display:inline-flex;align-items:center;gap:6px}
.sorth{cursor:pointer;user-select:none}
.sorth:hover{text-decoration:underline;text-underline-offset:3px}
.si{font-style:normal;font-size:10px;color:var(--ink)}
.fbtn{width:20px;height:20px;border:1px solid transparent;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#9a9a9a}
.fbtn:hover{border-color:var(--line2);color:var(--ink)}
.fbtn.on{background:var(--ink);color:#fff}
.fbtn svg{width:11px;height:11px}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr:hover td{background:#fafafa}
.dt td.num{text-align:right;white-space:nowrap}
.dt td.txt{min-width:90px;max-width:340px;white-space:pre-line}
.dt td.dte{white-space:nowrap}
.dt td.strong{font-weight:500}
.dt td.dim{color:var(--muted)}
.dt td.neg{color:var(--neg)}
.dt tfoot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0;background:var(--soft);white-space:nowrap}
.dt tfoot td.lbl{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.dt td.phc{width:1%;padding-top:8px;padding-bottom:8px}
.ph{display:block;width:54px;height:68px;padding:0;border:0;background:var(--soft2);cursor:zoom-in;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.broken img{display:none}
.ph.broken::after{content:'нет доступа';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;color:var(--muted);padding:2px}
.ph .more{position:absolute;right:2px;bottom:2px;background:var(--ink);color:#fff;font-size:9px;padding:0 4px;line-height:14px}
.nophoto{display:block;width:54px;height:68px;background:var(--soft);}

/* ---------- filter popover ---------- */
.pop{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--ink);width:300px;max-width:calc(100vw - 32px);box-shadow:0 14px 40px rgba(0,0,0,.14);padding:14px;font-size:13px}
.pop-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;margin-bottom:10px}
.pop-sort{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.pop-sort button{background:none;border:0;text-align:left;padding:5px 0;cursor:pointer}
.pop-sort button:hover{text-decoration:underline}
.pop .search{width:100%;min-width:0;margin-bottom:8px}
.pop-all,.pop-i{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
.pop-list{max-height:240px;overflow:auto;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.pop-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-i em{font-style:normal;color:var(--muted);font-size:11px}
.pop input[type=checkbox]{accent-color:var(--ink);margin:0}
.pop-f{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

/* ---------- amount due ---------- */
.due-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:24px 0 0}
.due-tools .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.chip{border:1px solid var(--line2);padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;background:var(--bg);display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip:not(.on){color:#9a9a9a;text-decoration:line-through}
.due-grid{display:block}
.due-grid .block{margin-top:40px}
.sec-label{display:flex;justify-content:space-between;align-items:center;margin:56px 0 0;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
body.print .sec-label{margin-top:28px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.97);display:flex;align-items:center;justify-content:center}
.lb img{max-width:92vw;max-height:86vh;object-fit:contain;box-shadow:0 10px 50px rgba(0,0,0,.08);background:var(--soft2)}
.lb-x,.lb-a{position:absolute;background:none;border:0;cursor:pointer;color:var(--ink)}
.lb-x{top:18px;right:22px;font-size:34px;line-height:1;font-weight:300}
.lb-a{top:50%;transform:translateY(-50%);font-size:44px;font-weight:200;padding:20px}
.lb-a.prev{left:10px}.lb-a.next{right:10px}
.lb-c{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.lb-open{position:absolute;bottom:18px;right:24px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

/* ---------- export dialog ---------- */
.dlg{border:1px solid var(--ink);padding:0;width:min(520px,calc(100vw - 32px));background:var(--bg);color:var(--ink)}
.dlg::backdrop{background:rgba(255,255,255,.75)}
.dlg form{padding:24px 26px 22px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.dlg-h .x{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;font-weight:300}
.fld{margin-bottom:16px}
.fld .lbl,.row2 .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}
.seg{display:flex;border:1px solid var(--ink)}
.seg label{flex:1;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 6px;font-size:12px;letter-spacing:.06em}
.seg label+label span{border-left:1px solid var(--ink)}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:2px solid #6aa0ff;outline-offset:-2px}
.sel{width:100%;height:36px;border:1px solid var(--line2);background:var(--bg);padding:0 8px;margin-top:8px}
.row2 .sel{margin-top:0}
.scale{display:flex;align-items:center;gap:12px;height:36px}
.scale input{flex:1;accent-color:var(--ink)}
.scale output{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.scale.off{opacity:.35}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;margin:4px 0 14px}
.chk input{accent-color:var(--ink);width:16px;height:16px;margin:0}
.dlg-note{font-size:12px;color:var(--muted);background:var(--soft);padding:10px 12px;line-height:1.55}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;font-size:13px;z-index:200;max-width:calc(100vw - 32px)}

/* ---------- login ---------- */
body.locked .top, body.locked main, body.locked #banner{display:none!important}
.gate{display:none}
body.locked .gate{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px}
.gate-box{width:min(380px,100%);display:flex;flex-direction:column;gap:18px}
.gate-box .logo{margin-bottom:22px}
.gl{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.gl input{height:44px;border:0;border-bottom:1px solid var(--line2);outline:none;font-size:15px;letter-spacing:.02em;text-transform:none;color:var(--ink);background:transparent;padding:0 2px}
.gl input:focus{border-bottom-color:var(--ink)}
.gate-err{min-height:18px;font-size:12px;color:var(--neg)}
.gate-btn{height:46px;justify-content:center}
.gate-btn[disabled]{opacity:.6;cursor:wait}

/* ---------- mobile ---------- */
@media(max-width:760px){
  .wrap{padding:0 16px}
  .top-inner{grid-template-columns:1fr auto;grid-template-areas:"logo logo" "status actions";padding-top:14px}
  .logo{grid-area:logo;font-size:22px}
  .status{grid-area:status}.actions{grid-area:actions}
  .btn{padding:0 12px}
  .btn .t{display:none}
  .tabs{justify-content:flex-start;gap:26px}
  .kpi-val{font-size:30px}
  .search{min-width:0;flex:1}
  .row2{grid-template-columns:1fr}
  .block-head{flex-wrap:wrap}
}

/* ---------- print (used by the PDF export) ---------- */
body.print{background:#fff}
body.print .pg{padding:0;overflow:hidden}
body.print .pg+.pg{break-before:page}
body.print .p-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
body.print .p-logo{font-weight:600;font-size:20px;letter-spacing:.16em}
body.print .p-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
body.print .p-tab{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;margin:22px 0 0}
body.print .block{margin-top:22px;break-inside:auto}
body.print .dt-wrap{overflow:visible!important;max-height:none!important}
body.print .dt th{position:static}
body.print .dt thead{display:table-header-group}
body.print .dt tr{break-inside:avoid}
body.print .kpis{border:1px solid var(--line);margin-top:10px}
body.print .kpi{padding:14px 10px 16px}
body.print .kpi-val{font-size:30px}
body.print .due-grid{display:block}
body.print .no-print{display:none!important}
body.print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body class="locked">
<div class="gate" id="gate">
  <form class="gate-box" id="gateForm" autocomplete="on">
    <div class="logo">FVLT Project<small>Resale</small></div>
    <label class="gl"><span>Логин</span><input name="login" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="gl"><span>Пароль</span><input name="pass" type="password" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" name="remember"> Запомнить на этом устройстве</label>
    <div class="gate-err" id="gateErr" role="alert"></div>
    <button class="btn dark gate-btn" type="submit">Войти</button>
  </form>
</div>

<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="status" id="status"><i class="dot busy"></i><span>Загрузка…</span></div>
      <div class="logo">FVLT Project<small>Resale</small></div>
      <div class="actions">
        <button class="btn" id="btnRefresh" title="Обновить данные"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span class="t">Обновить</span></button>
        <button class="btn dark" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span class="t">Выгрузить</span></button>
        <button class="btn" id="btnLogout" title="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span class="t">Выйти</span></button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap"></div></div>

<main class="wrap">
  <div id="kpiHost"></div>
  <div class="pane" data-pane="items"></div>
  <div class="pane" data-pane="sales" hidden></div>
  <div class="pane" data-pane="expenses" hidden></div>
  <div class="pane" data-pane="due" hidden></div>
</main>

<div class="lb" id="lb" hidden>
  <button class="lb-x" data-lb="close" aria-label="Закрыть">×</button>
  <button class="lb-a prev" data-lb="prev" aria-label="Назад">‹</button>
  <img alt="">
  <button class="lb-a next" data-lb="next" aria-label="Вперёд">›</button>
  <div class="lb-c"></div>
  <a class="lb-open" target="_blank" rel="noopener">Открыть оригинал ↗</a>
</div>

<dialog class="dlg" id="expDlg">
  <form method="dialog" id="expForm">
    <div class="dlg-h"><span>Выгрузка</span><button class="x" value="cancel" aria-label="Закрыть">×</button></div>
    <div class="fld"><div class="lbl">Формат</div>
      <div class="seg">
        <label><input type="radio" name="fmt" value="pdf" checked><span>PDF</span></label>
        <label><input type="radio" name="fmt" value="xlsx"><span>Excel</span></label>
      </div></div>
    <div class="fld"><div class="lbl">Что выгрузить</div>
      <div class="seg">
        <label><input type="radio" name="scope" value="all" checked><span>Весь дашборд</span></label>
        <label><input type="radio" name="scope" value="tab"><span>Отдельную вкладку</span></label>
      </div>
      <select class="sel" name="tab" id="expTab"></select></div>
    <div class="fld"><div class="lbl">Ориентация страницы</div>
      <div class="seg">
        <label><input type="radio" name="orient" value="landscape" checked><span>Альбомная</span></label>
        <label><input type="radio" name="orient" value="portrait"><span>Книжная</span></label>
      </div></div>
    <div class="fld row2">
      <div><div class="lbl">Формат листа</div><select class="sel" name="paper"><option value="A4">A4</option><option value="A3">A3</option></select></div>
      <div><div class="lbl">Масштаб содержимого</div><div class="scale" id="scaleBox"><input type="range" name="scale" min="25" max="200" step="5" value="100"><output>100%</output></div></div>
    </div>
    <label class="chk"><input type="checkbox" name="fit"> Уместить всё на одну страницу</label>
    <div class="dlg-note" id="expNote"></div>
    <div class="dlg-f"><button class="btn" value="cancel">Отмена</button><button class="btn dark" value="go">Выгрузить</button></div>
  </form>
</dialog>

<script>
(function(){
'use strict';

/* =====================================================================
   НАСТРОЙКИ — единственное место, которое нужно менять
   ===================================================================== */
const CONFIG = {
  // Опубликованные CSV-ссылки листов (Файл → Поделиться → Опубликовать в интернете → лист → CSV).
  // Можно вставить и обычную ссылку на лист вида .../edit#gid=123 — она будет преобразована.
  CSV: {
    items: '', sales: '', expenses: ''   // заполняются после входа (ссылки хранятся в зашифрованном виде в AUTH)
  },
  // Запасной вариант, если CSV-ссылки не заполнены: чтение по ID таблицы и названиям листов

  else if (ld > -1){ const p = s.split('.'); if (p.length > 2) s = s.replace(/\./g,''); }

function parseCSV(text){
  const rows = []; let row = [], f = '', q = false, i = 0; text = text.replace(/^﻿/, ''); const n = text.length;
  while (i < n){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; } f += c; i++; continue; }
    if (c === '"'){ q = true; i++; continue; }
    if (c === ','){ row.push(f); f = ''; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += c; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function buildSheet(text){
  const rows = parseCSV(text).map(r => r.map(v => v.trim()));
  const hi = rows.findIndex(r => r.some(v => v !== ''));
  if (hi < 0) return {headers:[], rows:[]};
  const head = rows[hi];
  let data = rows.slice(hi+1).filter(r => r.some(v => v !== ''));
  let width = head.length; data.forEach(r => { if (r.length > width) width = r.length; });
  const keep = [];
  for (let c=0;c<width;c++){ if ((head[c]||'').trim() || data.some(r => (r[c]||'') !== '')) keep.push(c); }
  const seen = {};
  const headers = keep.map(c => { let h = (head[c]||'').trim() || ('Column ' + (c+1)); if (seen[h]){ seen[h]++; h += ' (' + seen[h] + ')'; } else seen[h] = 1; return h; });
  data = data.map(r => keep.map(c => r[c] ?? ''));
  return {headers, rows:data};
}

      const on = !!this.st.filters[c.name];
      const si = s && s.col === c.name ? `<i class="si">${s.dir === 1 ? '↑' : '↓'}</i>` : '';
      return `<th class="${c.type === 'num' ? 'num' : ''}"><span class="th"><span class="sorth" data-c="${i}">${esc(c.name)}${si}</span>${filt ? `<button class="fbtn no-print${on ? ' on' : ''}" data-c="${i}" title="Фильтр">${ICON_FILTER}</button>` : ''}</span></th>`;
    }).join('');
    const body = rows.length ? rows.map(r => '<tr>' + vc.map(c => this.cell(c, r)).join('') + '</tr>').join('')
      : `<tr><td colspan="${vc.length}" class="empty">${this.rows.length ? 'Нет строк, подходящих под фильтр' : (this.o.emptyText || 'Нет данных')}</td></tr>`;
    const t = this.totals(rows, vc);
    const foot = t ? '<tfoot><tr>' + vc.map((c, i) => c.sum ? `<td class="num">${esc(fmt(t.vals[i]))}</td>` : `<td class="${i === t.labelIdx ? 'lbl' : ''}">${i === t.labelIdx ? 'Итого' : ''}</td>`).join('') + '</tr></tfoot>' : '';
    $('.dt-wrap', this.el).innerHTML = `<table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table>`;
    if (this.o.onChange) this.o.onChange(this);
  }
  exportData(){
    const rows = this.lastRows || this.view();
    const vc = this.vcols;
    const t = this.totals(rows, vc);
    return {
      columns: vc.map(c => ({name:c.name, type:c.type})),
      rows: rows.map(r => vc.map(c => {
        const v = String(c.get(r) ?? '');
        if (c.type === 'photo') return {v:'', img: splitUrls(v)[0] || ''};
        if (c.type === 'num'){ const n = parseNum(v); return {v, n}; }
        return {v};
      })),
      totals: t ? vc.map((c, i) => c.sum ? {n:t.vals[i]} : {v: i === t.labelIdx ? 'Итого' : ''}) : null
    };
  }
}

/* ---------------- column visibility popover ---------------- */
function placePop(p, anchor){
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  let left = Math.min(r.left, innerWidth - w - 16); left = Math.max(16, left);
  let top = r.bottom + 6; if (top + h > innerHeight - 12) top = Math.max(12, r.top - h - 6);
  p.style.left = left + 'px'; p.style.top = top + 'px';
}
function openColsPop(ck, columns, anchor){
  if (POP && POP._anchor === anchor){ closePop(); return; }
  closePop();
  const hidden = hiddenColsFor(ck, columns);
  const p = document.createElement('div'); p.className = 'pop'; p._anchor = anchor;
  p.innerHTML = `<div class="pop-h">Показывать столбцы</div>
    <div class="pop-list" style="border-top:0;margin-top:0;max-height:320px">${columns.map((c, i) => `<label class="pop-i"><input type="checkbox" data-i="${i}"${hidden.has(c.name) ? '' : ' checked'}><span title="${esc(c.name)}">${esc(c.name)}</span></label>`).join('')}</div>
    <div class="pop-f"><button class="linkbtn" data-a="all">Показать все</button><button class="btn dark sm" data-a="close">Готово</button></div>`;
  document.body.appendChild(p); POP = p;
  const sync = () => $$('input', p).forEach(i => { i.checked = !hidden.has(columns[+i.dataset.i].name); });
  $('.pop-list', p).addEventListener('change', e => {
    const n = columns[+e.target.dataset.i].name;
    if (e.target.checked) hidden.delete(n);
    else { if (hidden.size >= columns.length - 1){ e.target.checked = true; toast('Хотя бы один столбец должен остаться'); return; } hidden.add(n); }
    setHiddenCols(ck, hidden);
  });
  $('.pop-f', p).addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'all'){ hidden.clear(); setHiddenCols(ck, hidden); sync(); } else closePop();
  });
  placePop(p, anchor);
}

/* ---------------- filter popover ---------------- */
let POP = null;
function closePop(){

function openFilter(dt, c, anchor){
  if (POP && POP._anchor === anchor){ closePop(); return; }
  closePop();
  const counts = new Map();
  dt.filtered(c.name).forEach(r => { const k = fval(c, r); counts.set(k, (counts.get(k) || 0) + 1); });
  const keys = [...counts.keys()].sort((a, b) => cmpVals(c.type, a, b));
  const cur = dt.st.filters[c.name];
  const sel = new Set(cur ? cur.filter(k => counts.has(k)) : keys);
  const lab = c.type === 'num' ? ['По возрастанию','По убыванию'] : c.type === 'date' ? ['Сначала старые','Сначала новые'] : ['От А до Я','От Я до А'];
  const p = document.createElement('div');

  p.innerHTML = `<div class="pop-h">${esc(c.name)}</div>
    <div class="pop-sort"><button data-s="1">↑ ${lab[0]}</button><button data-s="-1">↓ ${lab[1]}</button></div>

    <div class="pop-list">${keys.map((k, i) => `<label class="pop-i" data-i="${i}"><input type="checkbox" data-i="${i}"${sel.has(k) ? ' checked' : ''}><span title="${esc(k)}">${esc(k)}</span><em>${counts.get(k)}</em></label>`).join('') || '<div class="muted">Нет значений</div>'}</div>
    <div class="pop-f"><span><button class="linkbtn" data-a="clear">Очистить фильтр</button> &nbsp; <button class="linkbtn" data-a="hide">Скрыть столбец</button></span><button class="btn dark sm" data-a="ok">Применить</button></div>`;
  document.body.appendChild(p); POP = p;
  const all = $('.pop-all input', p);
  const visibleItems = () => $$('.pop-i', p).filter(l => l.style.display !== 'none');
  const syncAll = () => { const v = visibleItems(); const n = v.filter(l => sel.has(keys[+l.dataset.i])).length; all.checked = v.length > 0 && n === v.length; all.indeterminate = n > 0 && n < v.length; };
  syncAll();
  $('.pop-list', p).addEventListener('change', e => { const k = keys[+e.target.dataset.i]; e.target.checked ? sel.add(k) : sel.delete(k); syncAll(); });
  all.addEventListener('change', () => { visibleItems().forEach(l => { const k = keys[+l.dataset.i]; all.checked ? sel.add(k) : sel.delete(k); $('input', l).checked = all.checked; }); syncAll(); });
  $('.pop-q', p).addEventListener('input', e => { const q = e.target.value.toLowerCase(); $$('.pop-i', p).forEach(l => { l.style.display = keys[+l.dataset.i].toLowerCase().includes(q) ? '' : 'none'; }); syncAll(); });
  $('.pop-sort', p).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; dt.st.sort = {col:c.name, dir:+b.dataset.s}; closePop(); dt.draw(); });
  $('.pop-f', p).addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'hide'){ const h = hiddenColsFor(dt.ck, dt.columns); if (h.size >= dt.columns.length - 1){ toast('Хотя бы один столбец должен остаться'); return; } h.add(c.name); closePop(); setHiddenCols(dt.ck, h); return; }
    if (a.dataset.a === 'clear') delete dt.st.filters[c.name];
    else { const q = $('.pop-q', p).value.trim(); let chosen = [...sel];
      if (q){ const vis = new Set(visibleItems().map(l => keys[+l.dataset.i])); chosen = chosen.filter(k => vis.has(k)); }
      if (chosen.length === keys.length && !q) delete dt.st.filters[c.name]; else dt.st.filters[c.name] = chosen; }
    closePop(); dt.draw();
  });
  placePop(p, anchor);
  setTimeout(() => $('.pop-q', p).focus({preventScroll:true}), 0);
}

/* Expenses */
function salesProfitByMonth(){
  const sa = S.data.sales, out = {full:new Map(), mon:new Map(), err:null, src:null};
  if (!sa || !sa.headers.length){ out.err = 'нет данных листа Sales'; return out; }
  const iFP = col(sa, 'finalProfit');
  if (iFP < 0){ out.err = 'на листе Sales не найден столбец Final Profit'; return out; }
  const cands = [col(sa, 'saleDate'), col(sa, 'month')].filter((v, i, a) => v >= 0 && a.indexOf(v) === i);
  let src = -1, order = CONFIG.DATE_ORDER;
  for (const c of cands){
    const vals = sa.rows.map(r => r[c]).filter(Boolean); const o = detectOrder(vals);
    if (vals.length && vals.filter(v => monthKey(v, o)).length / vals.length >= .5){ src = c; order = o; break; }
  }
  if (src < 0){ out.err = 'на листе Sales не найден столбец с датой продажи или месяцем'; return out; }
  out.src = sa.headers[src];
  sa.rows.forEach(r => {
    const k = monthKey(r[src], order), n = parseNum(r[iFP]); if (!k || isNaN(n)) return;
    const mk = k[0] === 'M' ? k : 'M' + k.slice(5);
    if (k[0] !== 'M') out.full.set(k, (out.full.get(k) || 0) + n);
    out.mon.set(mk, (out.mon.get(mk) || 0) + n);
  });
  return out;
}
function renderExpenses(){
  const p = pane('expenses'); p.innerHTML = '';
  const ex = S.data.expenses;
  if (!ex || !ex.headers.length){ emptyPane(p, sheetMissing('expenses')); return; }
  const cols = sheetCols(ex);
  let iMonth = col(ex, 'month'); if (iMonth < 0) iMonth = col(ex, 'saleDate'); if (iMonth < 0) iMonth = 0;
  const iA1 = col(ex, 'account1'), iA2 = col(ex, 'account2'), iFP = col(ex, 'finalProfit');
  const agg = salesProfitByMonth();
  const order = detectOrder(ex.rows.map(r => r[iMonth]));
  const calc = r => {
    if (agg.err) return null;
    const k = monthKey(r[iMonth], order); if (!k) return null;
    let s;
    if (k[0] === 'M') s = agg.mon.get(k) || 0;
    else s = agg.full.size ? (agg.full.get(k) || 0) : (agg.mon.get('M' + k.slice(5)) || 0);
    const a1 = iA1 >= 0 ? num0(r[iA1]) : 0, a2 = iA2 >= 0 ? num0(r[iA2]) : 0;
    return {s, a1, a2, v: Math.round((s - a1 - a2) * 100) / 100};
  };
  const salesCol = {name:'Profit (Sales)', type:'num', computed:true, sum:true, cls:'dim',
    get: r => { const c = calc(r); return c ? String(c.s) : ''; }};
  const fpCol = {name: iFP >= 0 ? ex.headers[iFP] : 'Final Profit', type:'num', computed:true, sum:true, cls:'strong',
    get: r => { const c = calc(r); return c ? String(c.v) : ''; },
    title: r => { const c = calc(r); return c ? `Sales ${fmt(c.s)} − Account1 ${fmt(c.a1)} − Account2 ${fmt(c.a2)}` : ''; }};
  if (iFP >= 0) cols.splice(iFP, 1, salesCol, fpCol); else cols.push(salesCol, fpCol);
  const {body, reg} = makeBlock(p, 'expenses-table', 'Expenses', {tab:'expenses', sub:`${ex.rows.length} ${plural(ex.rows.length,'строка','строки','строк')}`});
  const dt = new DataTable('expenses', cols, ex.rows, {tall:true}).mount(body);
  reg.exp = () => dt.exportData();
  const unparsed = agg.err ? 0 : ex.rows.filter(r => !monthKey(r[iMonth], order)).length;
  const notes = [];
  notes.push(`<b>${esc(fpCol.name)}</b> = сумма Final Profit с листа Sales за месяц − ${iA1 >= 0 ? esc(ex.headers[iA1]) : 'Account1'} − ${iA2 >= 0 ? esc(ex.headers[iA2]) : 'Account2'}. Месяц строки берётся из столбца «${esc(ex.headers[iMonth])}»${agg.src ? `, месяц продажи — из столбца «${esc(agg.src)}» листа Sales` : ''}. «Profit (Sales)» — промежуточная сумма для проверки; наведите на значение, чтобы увидеть расчёт.`);
  if (agg.err) notes.push(`<span class="warnline">Не удалось посчитать: ${esc(agg.err)}.</span>`);
  if (iA1 < 0 || iA2 < 0) notes.push(`<span class="warnline">Не найден столбец ${iA1 < 0 ? 'Account1' : ''}${iA1 < 0 && iA2 < 0 ? ' и ' : ''}${iA2 < 0 ? 'Account2' : ''} — он считается нулём.</span>`);
  if (unparsed) notes.push(`<span class="warnline">${unparsed} ${plural(unparsed,'строка','строки','строк')} без распознанного месяца — для них расчёт пустой.</span>`);
  body.insertAdjacentHTML('beforeend', `<p class="note">${notes.join('<br>')}</p>`);
}

/* Amount Due */
/* Фото: берём столбец со ссылками (например «ссылки на фото») на листе All Items.
   Пустые фото-столбцы (картинки, вставленные в ячейку, в CSV не попадают) заполняются этими ссылками,
   а в Sales пустые фото подтягиваются из All Items по ID. */
const urlCount = (sh, i) => sh.rows.reduce((n, r) => n + (splitUrls(r[i]).length ? 1 : 0), 0);
const photoIdx = sh => sheetCols(sh).map((c, i) => c.type === 'photo' ? i : -1).filter(i => i >= 0);
function preparePhotos(){
  const it = S.data.items, map = new Map();
  if (it && it.headers.length){
    if (!it._photoDone){
      let cands = photoIdx(it);
      if (CONFIG.COLUMNS.photo){ const i = it.headers.findIndex(h => norm(h) === norm(CONFIG.COLUMNS.photo)); if (i >= 0) cands = [i].concat(cands.filter(x => x !== i)); }
      let main = -1, best = 0;
      cands.forEach(i => { const n = urlCount(it, i); if (n > best){ best = n; main = i; } });
      it._photoMain = main; it._hideCol = null;
      if (main >= 0){
        const empties = cands.filter(i => i !== main && urlCount(it, i) === 0);
        if (empties.length){ it.rows.forEach(r => empties.forEach(e => { r[e] = r[main]; })); it._hideCol = it.headers[main]; }
      }
      it._photoDone = true;
    }
    const iId = col(it, 'id'), main = it._photoMain;
    if (iId >= 0 && main >= 0) it.rows.forEach(r => { const k = norm(r[iId]); if (k && splitUrls(r[main]).length) map.set(k, r[main]); });
  }
  S.photoMap = map;
  const sa = S.data.sales;
  if (sa && sa.headers.length && map.size){
    const iId = col(sa, 'id');
    if (iId >= 0) photoIdx(sa).forEach(pc => sa.rows.forEach(r => { if (!splitUrls(r[pc]).length){ const u = map.get(norm(r[iId])); if (u) r[pc] = u; } }));
  }
}
function itemsMaps(){
  const it = S.data.items, m = {photo:S.photoMap || new Map(), desc:new Map(), price:new Map()};
  if (!it) return m;
  const iId = col(it, 'id'); if (iId < 0) return m;
  const iDe = col(it, 'description'), iPr = col(it, 'price');
  it.rows.forEach(r => { const k = norm(r[iId]); if (!k) return;
    if (iDe >= 0 && r[iDe]) m.desc.set(k, r[iDe]);
    if (iPr >= 0 && r[iPr]) m.price.set(k, r[iPr]); });
  return m;
}
function renderDue(){
  const p = pane('due'); p.innerHTML = '';
  const sa = S.data.sales;
  if (!sa || !sa.headers.length){ emptyPane(p, sheetMissing('sales')); return; }
  const iSt = col(sa, 'status');
  if (iSt < 0){ emptyPane(p, 'На листе Sales не найден столбец Status'); return; }
  const iCl = col(sa, 'client'), iTo = col(sa, 'toClient'), iAD = col(sa, 'amountDue'), iId = col(sa, 'id'),
        iDe = col(sa, 'description'), iPr = col(sa, 'price');
  const scols = sheetCols(sa);
  const iSPh = scols.findIndex(c => c.type === 'photo');
  const M = itemsMaps();
  const key = r => iId >= 0 ? norm(r[iId]) : '';
  const photoOf = r => (key(r) && M.photo.get(key(r))) || (iSPh >= 0 ? r[iSPh] : '') || '';

/* ---------------- loading ---------------- */
function normalizeUrl(u){
  u = String(u || '').trim(); if (!u) return '';
  if (/\/pubhtml/.test(u)){ u = u.replace('/pubhtml', '/pub'); u = u.replace(/([?&])output=[^&]*/, '$1'); u += (u.includes('?') ? '&' : '?') + 'output=csv'; return u.replace(/[?&]{2,}/g, '&'); }
  if (/output=csv|tqx=out:csv|format=csv/.test(u)) return u;
  const m = u.match(/spreadsheets\/d\/([\w-]{20,})/);
  if (m && !/\/d\/e\//.test(u)){ const g = u.match(/[#&?]gid=(\d+)/); return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g ? '&gid=' + g[1] : ''}`; }
  if (/\/pub\b/.test(u)) return u + (u.includes('?') ? '&' : '?') + 'output=csv';
  return u;
}
function sheetUrl(key){
  const u = normalizeUrl(CONFIG.CSV[key]);
  if (u) return u;
  if (CONFIG.SHEET_ID) return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAMES[key])}`;
  return '';
}
async function fetchSheet(key){
  const base = sheetUrl(key); if (!base) throw new Error('ссылка не задана');
  const url = base + (base.includes('?') ? '&' : '?') + '_=' + Date.now();
  const res = await fetch(url, {cache:'no-store'});
  if (!res.ok) throw new Error('HTTP ' + res.status + (res.status === 401 || res.status === 403 ? ' — нет доступа к таблице' : ''));
  const text = await res.text();
  if (/^\s*</.test(text)) throw new Error('вместо CSV пришла веб-страница — лист не опубликован или нет доступа');
  return text;
}
function setStatus(kind, text, title){ const s = $('#status'); s.innerHTML = `<i class="dot ${kind}"></i><span>${esc(text)}</span>`; s.title = title || ''; }
function setBanner(html, err){ const b = $('#banner'); if (!html){ b.hidden = true; return; } b.hidden = false; b.classList.toggle('err', !!err); $('.wrap', b).innerHTML = html; }
const timeStr = d => d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

async function load(){
  if (S.loading) return; S.loading = true;
  const dot = $('#status .dot'); if (dot) dot.classList.add('busy');
  const keys = ['items','sales','expenses'];
  const res = await Promise.allSettled(keys.map(fetchSheet));
  S.loading = false;
  const texts = {}; S.errors = {};
  res.forEach((r, i) => { if (r.status === 'fulfilled') texts[keys[i]] = r.value; else S.errors[keys[i]] = (r.reason && r.reason.message) || 'ошибка загрузки'; });
  const okCount = Object.keys(texts).length;

  if (!okCount){
    if (!S.data.items && !S.data.sales && !S.data.expenses){
      S.demo = true; S.data = demoData(); preparePhotos(); S.raw = ''; render();
      setBanner(`<b>Не удалось загрузить Google-таблицу</b> (${esc(Object.values(S.errors)[0])}). Сейчас показаны <b>демо-данные</b>. Опубликуйте листы как CSV (Файл → Поделиться → Опубликовать в интернете) и вставьте ссылки в CONFIG в начале файла.`, true);
    }
    setStatus('err', 'Нет связи с таблицей', Object.entries(S.errors).map(([k, v]) => `${CONFIG.SHEET_NAMES[k]}: ${v}`).join('\n'));
    return;
  }
  const raw = keys.map(k => texts[k] ?? ('#ERR ' + k)).join('\u0001');
  if (raw !== S.raw || S.demo){
    keys.forEach(k => { if (texts[k] != null) S.data[k] = buildSheet(texts[k]); else if (S.demo) S.data[k] = null; });
    preparePhotos();
    S.demo = false; S.raw = raw; render();
  }
  S.lastOk = new Date();
  const errs = Object.entries(S.errors);
  if (errs.length){
    setBanner('Часть листов не загрузилась: ' + errs.map(([k, v]) => `«${esc(CONFIG.SHEET_NAMES[k])}» — ${esc(v)}`).join('; ') + '. Показаны последние доступные данные.', true);
    setStatus('warn', 'Обновлено частично · ' + timeStr(S.lastOk));
  } else {
    setBanner('');
    setStatus('ok', 'Обновлено ' + timeStr(S.lastOk), `Автообновление каждые ${CONFIG.REFRESH_SECONDS} с`);
  }
}

/* ---------------- export: PDF (через печать) ---------------- */
const PAPER = {A4:[210,297], A3:[297,420]};
function cloneBlock(b){
  const c = b.el.cloneNode(true);
  $$('.no-print', c).forEach(n => n.remove());
  $$('img', c).forEach(i => i.setAttribute('loading', 'eager'));
  return c.outerHTML;

async function exportPDF(o, pl){
  const [w, h] = PAPER[o.paper] || PAPER.A4;
  const pw = o.orient === 'landscape' ? h : w, ph = o.orient === 'landscape' ? w : h, margin = 10;
  const px = mm => mm * 96 / 25.4;
  const W = px(pw - 2*margin), H = px(ph - 2*margin) - 2;
  const head = t => `<div class="p-head"><div class="p-logo">FVLT PROJECT</div><div class="p-meta">${esc(t)} · ${esc(dateRu())}</div></div>`;
  const kpi = pl.kpiOn ? cloneBlock(BLOCKS.find(b => b.id === 'kpi')) : '';
  let pages;
  if (!pl.secs.length) pages = [head('Итоги') + kpi];
  else if (o.fit) pages = [head(pl.secs.length === 1 ? pl.secs[0].tab.title : 'Дашборд') + kpi + pl.secs.map(s => (pl.secs.length > 1 ? `<div class="p-tab">${esc(s.tab.title)}</div>` : '') + s.blocks.map(cloneBlock).join('')).join('')];
  else pages = pl.secs.map((s, i) => head(s.tab.title) + (i === 0 ? kpi : '') + s.blocks.map(cloneBlock).join(''));

  const css = $('#app-css').textContent;
  const fr = document.createElement('iframe');
  fr.setAttribute('aria-hidden', 'true');
  fr.style.cssText = `position:fixed;left:-99999px;top:0;width:${Math.ceil(W * 4)}px;height:200px;border:0;`;
  document.body.appendChild(fr);
  const d = fr.contentDocument;
  d.open();
  d.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>FVLT Project — ${esc(stamp())}</title>`
    + `<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">`
    + `<style>${css}</style><style>@page{size:${o.paper} ${o.orient};margin:${margin}mm} html,body{margin:0;padding:0}</style></head>`
    + `<body class="print">${pages.map(p => `<div class="pg">${p}</div>`).join('')}</body></html>`);
  d.close();
  toast('Готовлю PDF…', 1600);
  await new Promise(r => setTimeout(r, 60));
  const imgs = $$('img', d);
  await Promise.race([
    Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))),
    new Promise(r => setTimeout(r, 8000))
  ]);
  try{ await Promise.race([d.fonts.ready, new Promise(r => setTimeout(r, 2000))]); }catch(e){}
  $$('.pg', d).forEach(pg => {
    if (o.fit){
      // бинарный поиск максимального масштаба, при котором всё помещается на страницу
      // меряем уже с применённым zoom: при мелком масштабе браузер держит минимальный размер шрифта
      const fits = z => {
        pg.style.width = (W / z) + 'px'; pg.style.zoom = z; pg.style.height = 'auto';
        return pg.scrollWidth <= pg.clientWidth + 1 && pg.getBoundingClientRect().height <= H;
      };
      let lo = 0.03, hi = 1.6, z = lo;
      if (fits(hi)) z = hi;
      else { for (let k = 0; k < 16; k++){ const mid = (lo + hi) / 2; if (fits(mid)){ lo = mid; } else hi = mid; } z = lo; }
      pg.style.width = (W / z) + 'px'; pg.style.zoom = z;
      pg.style.height = (H / z) + 'px';
    } else {
      const z = o.scale / 100;
      pg.style.width = (W / z) + 'px'; pg.style.zoom = z;
    }
  });
  const win = fr.contentWindow;
  const cleanup = () => setTimeout(() => fr.remove(), 500);
  win.addEventListener('afterprint', cleanup);
  setTimeout(() => { if (document.body.contains(fr)) fr.remove(); }, 10 * 60 * 1000);
  win.focus(); win.print();
}

const scripts = {};
function loadScript(src){
  return scripts[src] || (scripts[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete scripts[src]; rej(new Error('не удалось загрузить библиотеку Excel')); }; document.head.appendChild(s); }));
}
const imgCache = new Map();
function imgToJpeg(url){
  if (imgCache.has(url)) return imgCache.get(url);
  const p = new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer';
    const t = setTimeout(() => rej(new Error('timeout')), 9000);
    im.onload = () => { clearTimeout(t);
      try{
        const S0 = 180, k = Math.min(1, S0 / Math.max(im.naturalWidth || S0, im.naturalHeight || S0));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round((im.naturalWidth || S0) * k)); c.height = Math.max(1, Math.round((im.naturalHeight || S0) * k));
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res({data: c.toDataURL('image/jpeg', .86), w: c.width, h: c.height});
      }catch(e){ rej(e); } };
    im.onerror = () => { clearTimeout(t); rej(new Error('img')); };
    im.src = imgUrl(url, 400);
  });
  imgCache.set(url, p); p.catch(() => imgCache.delete(url));
  return p;
}
async function exportXLSX(o, pl){

    const ws = wb.addWorksheet(name, {pageSetup: setup, views:[{showGridLines:false}]});
    const widths = [];

        r++;
      });
      if (d.totals){
        d.totals.forEach((t, ci) => {
          const cell = ws.getCell(r, ci + 1);
          if (t.n != null){ cell.value = t.n; cell.numFmt = Number.isInteger(t.n) ? '#,##0' : '#,##0.00'; cell.alignment = {horizontal:'right'}; }
          else cell.value = t.v || null;
          cell.font = {bold:true}; cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF4F4F4'}};
          cell.border = {top:{style:'thin', color:{argb:'FF0A0A0A'}}};
        });
        r++;
      }
      r += 2;
    });
    widths.forEach((w, ci) => { if (w) ws.getColumn(ci + 1).width = w; });
  });
  // images (with a small concurrency pool)
  let failed = 0, i = 0;
  const worker = async () => {
    while (i < jobs.length){
      const j = jobs[i++];
      try{
        const im = await imgToJpeg(j.url);
        const id = wb.addImage({base64: im.data, extension:'jpeg'});
        const k = Math.min(52 / im.w, 62 / im.h);
        j.ws.addImage(id, {tl:{col:j.col + 0.08, row:j.row - 1 + 0.06}, ext:{width: Math.round(im.w * k), height: Math.round(im.h * k)}, editAs:'oneCell'});
      }catch(e){
        failed++;
        const cell = j.ws.getCell(j.row, j.col + 1);
        cell.value = {text:'фото ↗', hyperlink: j.url}; cell.font = {color:{argb:'FF1F4E99'}, underline:true};
      }
    }
  };
  if (jobs.length) toast(`Вставляю фото (${jobs.length})…`, 2500);
  await Promise.all(Array.from({length: Math.min(6, jobs.length)}, worker));
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `FVLT_${o.scope === 'all' ? 'Dashboard' : (TABS.find(t => t.id === o.tab) || {title:'Tab'}).title.replace(/\s+/g, '_')}_${stamp()}.xlsx`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  if (failed) toast(`Excel готов. ${failed} фото не удалось вставить картинкой (хостинг запрещает) — вместо них ссылки.`, 6000);
}

/* ---------------- login ---------------- */
const b64d = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function unlock(login, pass){
  if (!window.crypto || !crypto.subtle) throw new Error('Браузер не поддерживает шифрование — откройте страницу по https');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(login.trim().toLowerCase() + '\u0000' + pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(AUTH.salt), iterations:AUTH.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  let plain;
  try{ plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(AUTH.iv)}, key, b64d(AUTH.data)); }
  catch(e){ const err = new Error('Неверный логин или пароль'); err.bad = true; throw err; }
  return JSON.parse(new TextDecoder().decode(plain));
}
const SESS = 'fvlt.session';
function savedSession(){
  for (const st of [sessionStorage, localStorage]){ try{ const v = st.getItem(SESS); if (v){ const o = JSON.parse(v); if (o && o.v === AUTH.data.slice(0, 16)) return o.csv; } }catch(e){} }
  return null;
}
function saveSession(csv, remember){
  const v = JSON.stringify({v:AUTH.data.slice(0, 16), csv});
  try{ (remember ? localStorage : sessionStorage).setItem(SESS, v); }catch(e){}
}
function logout(){ try{ sessionStorage.removeItem(SESS); localStorage.removeItem(SESS); }catch(e){} location.reload(); }
$('#btnLogout').addEventListener('click', logout);
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = $('.gate-btn', f), err = $('#gateErr');
  btn.disabled = true; btn.textContent = 'Проверяю…'; err.textContent = '';
  try{
    const csv = await unlock(f.login.value, f.pass.value);
    saveSession(csv, f.remember.checked);
    f.pass.value = '';
    start(csv);
  }catch(ex){ err.textContent = ex.message || 'Ошибка входа'; f.pass.select(); }
  finally{ btn.disabled = false; btn.textContent = 'Войти'; }
});

/* ---------------- boot ---------------- */
let started = false;
function start(csv){
  if (started) return; started = true;
  Object.assign(CONFIG.CSV, csv);
  document.body.classList.remove('locked');
  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, Math.max(15, CONFIG.REFRESH_SECONDS) * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (!S.lastOk || Date.now() - S.lastOk > 20000)) load(); });
}
renderTabs(); showTab(S.tab);
if (/[?&]demo\b/.test(location.search)){
  document.body.classList.remove('locked');
  S.demo = true; S.data = demoData(); preparePhotos(); render();
  setBanner('Демо-режим: показаны примерные данные.'); setStatus('warn', 'Демо-данные');
} else {
  const saved = savedSession();
  if (saved) start(saved); else setTimeout(() => $('#gateForm input[name=login]').focus(), 50);
}
})();
